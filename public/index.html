<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d5d46">
  <title>白色失明文字麻将</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section id="lobby" class="lobby-screen">
      <div class="brand-plaque">白色失明文字麻将</div>
      <div class="lobby-panel">
        <input id="name" class="mahjong-input" placeholder="你的昵称" maxlength="16" autocomplete="off">
        <div class="lobby-actions">
          <button id="create" class="mahjong-btn primary">创建房间</button>
          <div class="join-line">
            <input id="code" class="mahjong-input code-input" placeholder="房间码" maxlength="5" autocomplete="off">
            <button id="join" class="mahjong-btn">加入</button>
          </div>
        </div>
        <p id="err" class="err"></p>
      </div>
    </section>

    <section id="game" class="game-screen hidden">
      <header class="table-header">
        <div class="brand-mini">白色失明文字麻将</div>
        <div class="room-chip">房间 <strong id="roomCode"></strong><button id="copy" class="icon-btn" title="复制房间码">复制</button></div>
        <div class="deck-chip">余牌 <strong id="deckCount"></strong></div>
        <div class="host-actions">
          <button id="restart" class="mahjong-btn restart-btn hidden">重开本局</button>
          <button id="endGame" class="mahjong-btn end-game-btn hidden">结束对局</button>
        </div>
      </header>

      <div class="table-layout">
        <aside class="side-panel players-panel">
          <div class="panel-title">牌友</div>
          <div id="players" class="players-list"></div>
          <div class="leaderboard-title">房间累计积分</div>
          <div id="leaderboard" class="leaderboard"></div>
          <button id="start" class="mahjong-btn primary hidden">开局</button>
          <div id="winner" class="winner"></div>
        </aside>

        <section class="mahjong-table">
          <div id="tableSeats" class="table-seats"></div>
          <div class="table-rail top-rail"></div>
          <div class="table-rail left-rail"></div>
          <div class="table-rail right-rail"></div>

          <div class="center-board">
            <div class="center-mark">
              <span class="wind">東</span>
              <span class="center-name">白色失明</span>
            </div>

            <div id="discardZone" class="discard-zone">
              <div class="zone-label">牌河</div>
              <div id="discard" class="discard-list"></div>
            </div>

            <div id="voteBox" class="vote-box hidden">
              <div id="voteTitle" class="vote-title"></div>
              <div id="voteTiles" class="tiles small vote-tiles"></div>
              <div id="voteCount" class="vote-count"></div>
              <div id="voteStatus" class="vote-status"></div>
              <div class="vote-actions">
                <button id="voteYes" class="mahjong-btn approve">认可</button>
                <button id="voteNo" class="mahjong-btn reject">不认可</button>
              </div>
            </div>
          </div>

          <div class="my-seat">
            <div id="selfSeat" class="self-seat-badge"></div>
            <div id="turnPrompt" class="turn-prompt">等待开局</div>
            <div class="hand-meta">
              <span>我的手牌</span>
              <span id="selectionHint" class="selection-hint">点击牌面选择</span>
            </div>
            <div id="hand" class="tiles hand-tiles"></div>
            <div class="table-actions">
              <button id="draw" class="mahjong-btn draw-btn">摸牌</button>
              <button id="skip" class="mahjong-btn skip-btn">跳过不出</button>
              <button id="discardBtn" class="mahjong-btn discard-btn">出牌（至少3字）</button>
<div class="score-rule">每成功打出1字 +1分 · 最先打光手牌者获胜并 +10分</div>
              <div class="homophone-tip">提示：允许使用谐音字，只要多数玩家认可即可。</div>
            </div>
          </div>
        </section>

        <aside class="side-panel chat-panel">
          <div class="panel-title">桌边消息</div>
          <div id="feed" class="feed"></div>
          <div class="chat-row">
            <input id="chat" class="mahjong-input" placeholder="说点什么" maxlength="120">
            <button id="send" class="mahjong-btn">发送</button>
          </div>
        </aside>
      </div>
    </section>

    <div id="finalOverlay" class="final-overlay hidden">
      <div class="final-card">
        <div class="final-title">对局结算</div>
        <div id="finalEndedBy" class="final-ended-by"></div>
        <div id="finalLeaderboard" class="final-leaderboard"></div>
        <button id="finalReturn" class="mahjong-btn primary final-return">返回大厅（5）</button>
      </div>
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
